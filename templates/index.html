<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Lite - Employee Management</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

        /* ── Palette ─────────────────────────────── */
        :root {
          --bg: #f5f2ed;
          --bg-subtle: #ebe7e0;
          --surface: #ffffff;
          --surface-hover: #fafaf8;
          --border: #e0dbd3;
          --border-strong: #c9c2b7;

          --text-primary: #1c1917;
          --text-secondary: #57534e;
          --text-muted: #a8a29e;

          --brand: #1B4332;
          --brand-light: #2D6A4F;
          --brand-lighter: #40916C;
          --brand-surface: #D8F3DC;

          --accent: #C2703E;
          --accent-light: #D4885A;
          --accent-surface: #FDE8D0;

          --danger: #B91C1C;
          --danger-surface: #FEE2E2;
          --danger-text: #7F1D1D;

          --success: #15803D;
          --success-surface: #DCFCE7;
          --success-text: #14532D;

          --radius: 10px;
          --shadow-sm: 0 1px 2px rgba(28,25,23,.06);
          --shadow-md: 0 4px 16px rgba(28,25,23,.08);
          --shadow-lg: 0 12px 40px rgba(28,25,23,.1);
        }

        /* ── Reset ────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
          background: var(--bg);
          color: var(--text-primary);
          -webkit-font-smoothing: antialiased;
          min-height: 100vh;
        }

        /* ── App Shell ────────────────────────────── */
        .hrms-app {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }

        /* ── Alert Toast ──────────────────────────── */
        .alert-toast {
          position: fixed;
          top: 20px;
          right: 20px;
          z-index: 100;
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 14px 20px;
          border-radius: var(--radius);
          font-size: 14px;
          font-weight: 500;
          box-shadow: var(--shadow-lg);
          animation: toastIn .35s cubic-bezier(.16,1,.3,1);
          max-width: 380px;
        }
        .alert-success { background: var(--success-surface); color: var(--success-text); border: 1px solid #86EFAC; }
        .alert-error { background: var(--danger-surface); color: var(--danger-text); border: 1px solid #FCA5A5; }
        .alert-close {
          background: none; border: none; cursor: pointer; opacity: .5; padding: 2px;
          color: inherit; margin-left: auto; transition: opacity .2s;
        }
        .alert-close:hover { opacity: 1; }

        @keyframes toastIn {
          from { opacity: 0; transform: translateX(20px); }
          to { opacity: 1; transform: translateX(0); }
        }

        /* ── Header ───────────────────────────────── */
        .hrms-header {
          background: var(--brand);
          border-bottom: 3px solid var(--accent);
        }
        .header-content {
          max-width: 1120px;
          margin: 0 auto;
          padding: 28px 32px 20px;
        }
        .header-brand {
          display: flex;
          align-items: center;
          gap: 14px;
          margin-bottom: 20px;
        }
        .brand-icon {
          width: 44px; height: 44px;
          background: rgba(255,255,255,.12);
          border-radius: 10px;
          display: grid; place-items: center;
          color: #A7F3D0;
          font-size: 24px;
        }
        .header-brand h1 {
          font-size: 26px;
          font-weight: 700;
          color: #fff;
          letter-spacing: -.4px;
          line-height: 1.1;
        }
        .header-brand p {
          font-size: 13px;
          color: rgba(255,255,255,.6);
          font-weight: 400;
          margin-top: 2px;
          letter-spacing: .2px;
        }

        /* ── Nav ──────────────────────────────────── */
        .header-nav {
          display: flex;
          gap: 6px;
        }
        .nav-link {
          padding: 9px 20px;
          font-size: 13px;
          font-weight: 600;
          color: rgba(255,255,255,.65);
          text-decoration: none;
          border-radius: 8px;
          transition: background .2s, color .2s;
          letter-spacing: .2px;
        }
        .nav-link:hover { background: rgba(255,255,255,.08); color: rgba(255,255,255,.9); }
        .nav-link.active {
          background: rgba(255,255,255,.14);
          color: #fff;
        }

        /* ── Main ─────────────────────────────────── */
        .hrms-main {
          max-width: 1120px;
          margin: 0 auto;
          padding: 32px;
          width: 100%;
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 28px;
        }

        /* ── Cards ────────────────────────────────── */
        .card {
          background: var(--surface);
          border-radius: var(--radius);
          border: 1px solid var(--border);
          box-shadow: var(--shadow-md);
          padding: 28px 32px;
          animation: cardIn .5s cubic-bezier(.16,1,.3,1) backwards;
        }
        .card:nth-child(2) { animation-delay: .08s; }

        @keyframes cardIn {
          from { opacity: 0; transform: translateY(16px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 24px;
          padding-bottom: 16px;
          border-bottom: 2px solid var(--bg-subtle);
          color: var(--brand);
        }
        .card-header h2 {
          font-size: 18px;
          font-weight: 700;
          color: var(--text-primary);
          letter-spacing: -.2px;
        }
        .badge {
          margin-left: auto;
          background: var(--brand-surface);
          color: var(--brand);
          padding: 3px 12px;
          border-radius: 20px;
          font-size: 12px;
          font-weight: 700;
        }

        /* ── Form ─────────────────────────────────── */
        .form-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
          margin-bottom: 24px;
        }
        .form-field {
          margin-bottom: 20px;
        }
        .form-field label {
          display: block;
          font-size: 13px;
          font-weight: 600;
          color: var(--text-secondary);
          margin-bottom: 6px;
          letter-spacing: .15px;
        }
        .form-field input,
        .form-field select {
          width: 100%;
          padding: 11px 14px;
          border: 1.5px solid var(--border);
          border-radius: 8px;
          font-size: 14px;
          font-family: inherit;
          color: var(--text-primary);
          background: var(--surface);
          transition: border-color .2s, box-shadow .2s;
        }
        .form-field input::placeholder { color: var(--text-muted); }
        .form-field input:hover,
        .form-field select:hover { border-color: var(--border-strong); }
        .form-field input:focus,
        .form-field select:focus {
          outline: none;
          border-color: var(--brand);
          box-shadow: 0 0 0 3px rgba(27,67,50,.1);
        }

        /* ── Buttons ──────────────────────────────── */
        .btn-primary {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 12px 28px;
          background: var(--brand);
          color: #fff;
          border: none;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          transition: background .2s, transform .15s, box-shadow .2s;
          box-shadow: 0 2px 8px rgba(27,67,50,.25);
          letter-spacing: .2px;
        }
        .btn-primary:hover {
          background: var(--brand-light);
          transform: translateY(-1px);
          box-shadow: 0 4px 14px rgba(27,67,50,.3);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
          opacity: .6;
          cursor: not-allowed;
          transform: none;
        }

        .btn-delete {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          padding: 7px 14px;
          background: var(--danger-surface);
          color: var(--danger);
          border: 1px solid #FECACA;
          border-radius: 6px;
          font-size: 12px;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          transition: background .2s, color .2s, transform .15s;
        }
        .btn-delete:hover {
          background: var(--danger);
          color: #fff;
          border-color: var(--danger);
          transform: translateY(-1px);
        }
        .btn-delete:active { transform: translateY(0); }

        /* ── Table ────────────────────────────────── */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
          text-align: left;
          padding: 12px 16px;
          font-size: 11px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: .8px;
          color: var(--text-muted);
          border-bottom: 2px solid var(--bg-subtle);
          background: var(--surface-hover);
        }
        thead th:first-child { border-radius: 8px 0 0 0; }
        thead th:last-child { border-radius: 0 8px 0 0; }

        tbody td {
          padding: 14px 16px;
          font-size: 14px;
          color: var(--text-secondary);
          border-bottom: 1px solid var(--bg-subtle);
          vertical-align: middle;
        }
        tbody tr { transition: background .15s; }
        tbody tr:hover { background: var(--surface-hover); }
        tbody tr:last-child td { border-bottom: none; }

        .emp-id {
          font-family: 'DM Sans', monospace;
          font-weight: 600;
          font-size: 13px;
          color: var(--brand);
          background: var(--brand-surface);
          padding: 3px 10px;
          border-radius: 5px;
        }
        .emp-name { font-weight: 600; color: var(--text-primary); }
        .dept-tag {
          display: inline-block;
          padding: 3px 12px;
          background: var(--accent-surface);
          color: var(--accent);
          border-radius: 20px;
          font-size: 12px;
          font-weight: 600;
        }

        /* ── States ───────────────────────────────── */
        .loading-state {
          text-align: center;
          padding: 56px 20px;
          color: var(--text-muted);
        }
        .loading-state p { margin-top: 14px; font-size: 14px; font-weight: 500; }

        .empty-state {
          text-align: center;
          padding: 64px 20px;
          color: var(--text-muted);
        }
        .empty-state svg { opacity: .2; margin-bottom: 16px; }
        .empty-state p { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
        .empty-state span { font-size: 13px; }

        /* ── Spinner ──────────────────────────────── */
        .spin { animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer ───────────────────────────────── */
        .hrms-footer {
          text-align: center;
          padding: 20px;
          color: var(--text-muted);
          font-size: 12px;
          font-weight: 500;
          letter-spacing: .2px;
          border-top: 1px solid var(--border);
          margin-top: auto;
        }

        /* ── Responsive ───────────────────────────── */
        @media (max-width: 768px) {
          .header-content { padding: 20px; }
          .header-brand h1 { font-size: 22px; }
          .header-nav { flex-direction: column; gap: 4px; }
          .hrms-main { padding: 20px; gap: 20px; }
          .card { padding: 20px; }
          .form-grid { grid-template-columns: 1fr; gap: 16px; }
          .table-wrap { margin: 0 -20px; padding: 0 20px; }
          table { font-size: 13px; }
          thead th, tbody td { padding: 10px 12px; }
          .btn-primary { width: 100%; justify-content: center; }
        }

        /* ── Scrollbar ────────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-subtle); }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>
    <div class="hrms-app">
        <!-- Header -->
        <header class="hrms-header">
            <div class="header-content">
                <div class="header-brand">
                    <div class="brand-icon">🏢</div>
                    <div>
                        <h1>HRMS Lite</h1>
                        <p>Lightweight Human Resource Management System</p>
                    </div>
                </div>
                <nav class="header-nav">
                    <a href="/" class="nav-link active">Employee Management</a>
                    <a href="/attendance" class="nav-link">Attendance Management</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="hrms-main">
            <!-- Add Employee Card -->
            <div class="card">
                <div class="card-header">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z"/>
                    </svg>
                    <h2>Add New Employee</h2>
                </div>
                
                <form id="employeeForm">
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="employee_id">Employee ID *</label>
                            <input type="text" id="employee_id" name="employee_id" required placeholder="e.g., EMP001">
                        </div>
                        <div class="form-field">
                            <label for="full_name">Full Name *</label>
                            <input type="text" id="full_name" name="full_name" required placeholder="e.g., John Doe">
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required placeholder="e.g., john.doe@company.com">
                        </div>
                        <div class="form-field">
                            <label for="department">Department *</label>
                            <input type="text" id="department" name="department" required placeholder="e.g., Engineering">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"/>
                        </svg>
                        Add Employee
                    </button>
                </form>
            </div>

            <!-- Employee List Card -->
            <div class="card">
                <div class="card-header">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                    </svg>
                    <h2>Employee List</h2>
                    <span class="badge" id="employeeCount">0</span>
                </div>
                
                <div id="employeeList">
                    <div class="loading-state">
                        <svg width="40" height="40" fill="currentColor" viewBox="0 0 20 20" class="spin">
                            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
                        </svg>
                        <p>Loading employees...</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="hrms-footer">
            © 2026 HRMS Lite. All rights reserved.
        </footer>
    </div>

    <script>
        // Show alert message
        function showAlert(message, type) {
            // Remove existing alerts
            const existingAlerts = document.querySelectorAll('.alert-toast');
            existingAlerts.forEach(alert => alert.remove());

            // Create new alert
            const alert = document.createElement('div');
            alert.className = `alert-toast alert-${type}`;
            alert.innerHTML = `
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                    ${type === 'success' 
                        ? '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>'
                        : '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>'
                    }
                </svg>
                <span>${message}</span>
                <button class="alert-close" onclick="this.parentElement.remove()">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
            `;
            document.body.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Load employees
        async function loadEmployees() {
            try {
                const response = await fetch('/api/employees');
                const employees = await response.json();

                const employeeList = document.getElementById('employeeList');
                const employeeCount = document.getElementById('employeeCount');
                
                employeeCount.textContent = employees.length;

                if (employees.length === 0) {
                    employeeList.innerHTML = `
                        <div class="empty-state">
                            <svg width="80" height="80" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            <p>No employees found</p>
                            <span>Add your first employee using the form above</span>
                        </div>
                    `;
                    return;
                }

                let tableHTML = `
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Employee ID</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Department</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                employees.forEach(emp => {
                    tableHTML += `
                        <tr>
                            <td><span class="emp-id">${emp.employee_id}</span></td>
                            <td class="emp-name">${emp.full_name}</td>
                            <td>${emp.email}</td>
                            <td><span class="dept-tag">${emp.department}</span></td>
                            <td>
                                <button class="btn-delete" onclick="deleteEmployee(${emp.id}, '${emp.full_name}')">
                                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                                    </svg>
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += `
                            </tbody>
                        </table>
                    </div>
                `;

                employeeList.innerHTML = tableHTML;

            } catch (error) {
                const employeeList = document.getElementById('employeeList');
                employeeList.innerHTML = `
                    <div class="empty-state">
                        <svg width="80" height="80" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                        <p>Failed to load employees</p>
                        <span>Please refresh the page and try again</span>
                    </div>
                `;
                showAlert('Failed to load employees. Please try again.', 'error');
            }
        }

        // Add employee
        document.getElementById('employeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                employee_id: document.getElementById('employee_id').value,
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value
            };

            try {
                const response = await fetch('/api/employees', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Employee added successfully!', 'success');
                    document.getElementById('employeeForm').reset();
                    loadEmployees();
                } else {
                    showAlert(data.error || 'Failed to add employee', 'error');
                }

            } catch (error) {
                showAlert('Network error. Please try again.', 'error');
            }
        });

        // Delete employee
        async function deleteEmployee(id, name) {
            if (!confirm(`Are you sure you want to delete ${name}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/employees/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Employee deleted successfully!', 'success');
                    loadEmployees();
                } else {
                    showAlert(data.error || 'Failed to delete employee', 'error');
                }

            } catch (error) {
                showAlert('Network error. Please try again.', 'error');
            }
        }

        // Load employees on page load
        loadEmployees();
    </script>
</body>
</html>
